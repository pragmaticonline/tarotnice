<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans+Thai:wght@400;500&display=swap">
<style>
/* Layout: one dawn-sky stage — slots on top, deck/fan below, reading text under it. Single deliberate light look. */
:root{
  --bg:#f6f1fa; --bg-2:#fbe9e1; --ink:#2e2547; --muted:#76698f;
  --back:#4a3d78; --back-2:#5b4c8f; --accent:#4a3d78; --on-accent:#fffaf2; --frame:rgba(255,255,255,.45); --shadow:rgba(74,61,120,.22);
  --night:#4a3d78; --night-2:#5b4c8f;
  --gold:#b0832f; --gold-dim:#cdb27a; --card-face:#fffaf0; --card-ink:#2e2547;
  --f-display:"Cormorant Garamond", "Times New Roman", serif;
  --f-body:"IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
  color-scheme:light;
}
:root[data-mode="night"]{
  --bg:#15122b; --bg-2:#2a2150; --ink:#ece6d6; --muted:#a59fbf;
  --back:#2e2760; --accent:#d8b46a; --on-accent:#15122b;
  --gold:#d8b46a; --gold-dim:#8a7444; --card-face:#f3ecdc; --card-ink:#2a2347;
  --frame:rgba(255,255,255,.04); --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
body{transition:background-color .5s,color .5s}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mode{display:flex;border:1px solid var(--gold-dim);border-radius:999px;overflow:hidden}
.mode button{background:none;border:0;color:var(--muted);font:inherit;font-size:.85rem;padding:5px 12px;cursor:pointer;display:flex;align-items:center;gap:5px}
.mode button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.mode svg{width:14px;height:14px}
.mode button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
html,body{min-height:100%}
html{background:var(--bg)}
body{background:radial-gradient(120% 70% at 50% 0%, var(--bg-2), var(--bg) 65%);background-color:var(--bg);color:var(--ink);font-family:var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px;}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:600;font-size:2rem;margin:0;letter-spacing:.02em;color:var(--accent)}
h1 small{font-family:var(--f-body);font-size:.8rem;color:var(--muted);font-weight:400;margin-left:8px;letter-spacing:0}
.lang{display:flex;border:1px solid var(--gold-dim);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--muted);font:inherit;font-size:.85rem;padding:5px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.quota{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.9rem}
.pips{display:flex;gap:5px}.pip{width:12px;height:18px;border-radius:2px;border:1px solid var(--gold-dim);background:var(--gold)}
.pip.used{background:transparent}
.ask{display:grid;gap:8px}
.ask label{font-family:var(--f-display);font-size:1.3rem;font-weight:600;color:var(--accent)}
.ask textarea{font:inherit;font-size:1rem;line-height:1.5;color:var(--card-ink);background:var(--card-face);border:1px solid var(--gold-dim);border-radius:12px;padding:10px 12px;resize:none;width:100%;box-sizing:border-box}
.ask textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.ask textarea.need{border-color:#c0564b;outline:2px solid #c0564b}
.topics{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tl{font-size:.85rem;color:var(--muted);margin-right:2px}
.chip{font:inherit;font-size:.85rem;border:1px solid var(--gold-dim);background:transparent;color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"],.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ask .go{justify-self:start;margin-top:4px}
#shuffle{display:none}
.asked{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.asked .chip{cursor:default;font-size:.78rem;padding:3px 10px}
.q{font-family:var(--f-display);font-style:italic;font-size:1.25rem;color:var(--ink);text-wrap:balance;margin:0}
.stage{position:relative;height:420px;max-width:100%;perspective:1200px;overflow:hidden;touch-action:manipulation}
.slotlabel-unused{position:absolute;top:0;transform:translateX(-50%);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;white-space:nowrap}
.slotframe{position:absolute;border:1px dashed var(--gold-dim);border-radius:10px;background:var(--frame)}
.card{position:absolute;left:0;top:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.2,1);will-change:transform;cursor:default;border:0;padding:0;background:none}
.card.pickable{cursor:pointer}
.card.pickable:hover .inner,.card.pickable:focus-visible .inner{transform:translateY(-14px)}
.card:focus-visible{outline:none}.card:focus-visible .back{box-shadow:0 0 0 3px var(--gold)}
.pip{background:var(--accent)!important;border-color:var(--accent)!important}.pip.used{background:transparent!important}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:9px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 1px 3px var(--shadow)}
.card.flipped .face,.card.pickable:hover .face{box-shadow:0 6px 16px var(--shadow)}
.back{background:
  radial-gradient(circle at 50% 50%, transparent 17%, var(--gold) 18%, transparent 19.5%),
  radial-gradient(circle at 50% 50%, var(--gold-dim) 0 6%, transparent 7%),
  repeating-conic-gradient(from 0deg at 50% 50%, rgba(232,204,140,.22) 0 4deg, transparent 4deg 15deg),
  var(--back);border:1.5px solid var(--gold-dim);outline:3px solid var(--back);outline-offset:-7px}
.front{transform:rotateY(180deg);background:var(--card-face);color:var(--card-ink);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10% 6%;border:1.5px solid var(--gold);text-align:center}
.front .fx{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.card.rev .front .fx{transform:rotate(180deg)}
.num{font-family:var(--f-display);font-weight:600;font-size:1.15em;letter-spacing:.1em}
.front svg{width:62%;height:auto}
.nm{font-family:var(--f-display);font-weight:600;font-size:.95em;line-height:1.05}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{font:inherit;font-weight:500;border-radius:999px;padding:11px 24px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.lang button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hint{text-align:center;color:var(--muted);min-height:1.4em;margin:0}
.reading{display:grid;gap:10px}
.rc{border-left:2px solid var(--gold-dim);padding-left:12px;opacity:0;transform:translateY(6px);transition:.5s}
.rc.on{opacity:1;transform:none}
.rc b{font-family:var(--f-display);font-size:1.15rem;color:var(--accent);font-weight:600}
.rc span{color:var(--muted);font-size:.85rem}
.rc p{margin:2px 0 0;line-height:1.6;max-width:62ch}
.note{font-size:.78rem;color:var(--muted);border-top:1px solid var(--gold-dim);padding-top:10px}
@media (prefers-reduced-motion:reduce){.card,.inner,.rc{transition-duration:.01s!important}}

:root{--cat:#93a1b8;--cat-light:#c9d2df;--cat-dark:#6f7d96;--cat-ear:#e3b3bb;--cat-eye:#86c06a}
:root[data-mode="night"]{--cat:#a2afc5;--cat-light:#d6deea;--cat-dark:#7a88a2}
h1{display:flex;align-items:center;gap:8px}
.mark{width:38px;height:auto;flex:none}
.guide{display:flex;align-items:flex-end;gap:12px;justify-content:center}
.ngern{width:92px;height:auto;flex:none;overflow:visible}
.bubble{position:relative;margin:0 0 34px;background:var(--card-face);color:var(--card-ink);border:1px solid var(--gold-dim);border-radius:14px;padding:9px 14px;max-width:34ch;min-width:0;line-height:1.45}
.bubble::before{content:"";position:absolute;left:-7px;bottom:12px;width:12px;height:12px;background:var(--card-face);border-left:1px solid var(--gold-dim);border-bottom:1px solid var(--gold-dim);transform:rotate(45deg)}
.ngern .eyes,.ngern .head,.ngern .tail{transform-box:fill-box}
.ngern .eyes{transform-origin:center;animation:blink 4.5s infinite}
.ngern .shut,.ngern .zzz{display:none}
.ngern .tail{transform-origin:0% 100%;animation:swish 3s ease-in-out infinite}
.ngern .head{transform-origin:50% 100%;transition:transform .4s}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes swish{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes float{0%,100%{transform:translate(0,0);opacity:.4}50%{transform:translate(3px,-5px);opacity:1}}
.guide.s-shuffling .ngern{animation:bob .45s ease-in-out infinite}
.guide.s-shuffling .tail{animation-duration:.6s}
.guide.s-picking .head{transform:rotate(-7deg)}
.guide.s-reveal .eyes{animation:blink 1.1s infinite}
.guide.s-done .head{transform:rotate(5deg)}
.guide.s-sleep .eyes{display:none}.guide.s-sleep .shut,.guide.s-sleep .zzz{display:inline}
.guide.s-sleep .zzz{animation:float 2.4s ease-in-out infinite}.guide.s-sleep .tail{animation:none}
@media (prefers-reduced-motion:reduce){.ngern,.ngern *{animation:none!important}}

.sharebar{display:flex;justify-content:center}
.btn.share{display:inline-flex;align-items:center;gap:8px}
.btn.share svg{width:16px;height:16px}
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(20,16,40,.45);padding:0 max(0px,env(safe-area-inset-right,0px)) 0 max(0px,env(safe-area-inset-left,0px))}
.sheet .panel{background:var(--bg);color:var(--ink);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;max-height:92vh;overflow:auto;box-sizing:border-box}
.panel h2{margin:0;font-family:var(--f-display);font-size:1.4rem;color:var(--accent)}
.story{width:min(230px,62vw);aspect-ratio:9/16;margin:0 auto;border-radius:14px;overflow:hidden;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:14px 10px;box-sizing:border-box;text-align:center;
  background:radial-gradient(120% 60% at 50% 0%,#fbe9e1,#efe6f8 55%,#e3d7f2);color:#2e2547}
:root[data-mode="night"] .story{background:radial-gradient(120% 60% at 50% 0%,#2a2150,#15122b 60%);color:#ece6d6}
.story .brand{display:flex;align-items:center;gap:5px;font-family:var(--f-display);font-weight:600;font-size:1rem}
.story .brand svg{width:20px}
.story .sq{font-family:var(--f-display);font-style:italic;font-size:.82rem;line-height:1.25;text-wrap:balance;margin:0}
.story .minis{display:flex;gap:6px;justify-content:center}
.mini{position:relative;width:56px;aspect-ratio:1/1.65;font-size:7.5px;background:var(--card-face);color:var(--card-ink);border:1px solid var(--gold);border-radius:5px;display:flex;padding:8% 5%;box-sizing:border-box}
.mini .fx{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.mini svg{width:60%}
.mini.rev .fx{transform:rotate(180deg)}
.story .sum{font-size:.72rem;line-height:1.45;margin:0;padding:0 4px}
.story .cta{font-size:.68rem;opacity:.85}
.story .cta b{display:block;font-size:.8rem;letter-spacing:.03em}
.story .ng{width:40px}
.toggle{display:flex;align-items:center;gap:8px;font-size:.9rem;justify-content:center}
.targets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tgt{font:inherit;font-size:.85rem;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;border:1px solid var(--gold-dim);background:var(--card-face);color:var(--card-ink);text-decoration:none;cursor:pointer}
.tgt i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:700;font-size:.8rem}
.tgt:focus-visible{outline:2px solid var(--accent)}
.sheet .close{justify-self:center}
.toast{text-align:center;font-size:.85rem;color:var(--muted);min-height:1.2em;margin:0}
</style>

  <div class="reading" id="reading"></div>
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="shH">
    <div class="panel">
      <h2 id="shH"></h2>
      <div class="story" id="story"></div>
      <label class="toggle"><input type="checkbox" id="showQ"> <span id="showQT"></span></label>
      <div class="targets">
        <a class="tgt" id="tLine" target="_blank" rel="noopener"><i style="background:#06c755">L</i>LINE</a>
        <a class="tgt" id="tFb" target="_blank" rel="noopener"><i style="background:#1877f2">f</i>Facebook</a>
        <a class="tgt" id="tX" target="_blank" rel="noopener"><i style="background:#111">X</i>X</a>
        <button class="tgt" type="button" id="tIg"><i style="background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af)">IG</i><span id="tIgT"></span></button>
        <button class="tgt" type="button" id="tSave"><i style="background:var(--back)">↓</i><span id="tSaveT"></span></button>
        <button class="tgt" type="button" id="tCopy"><i style="background:var(--gold)">⧉</i><span id="tCopyT"></span></button>
      </div>
      <p class="toast" id="toast"></p>
      <button class="btn ghost close" type="button" id="shClose"></button>
    </div>
  </div>

</div>

<script>
const T={
 th:{day:"กลางวัน",night:"กลางคืน",tag:"ไพ่ทาโรต์",q:"“งานใหม่ที่กำลังจะเริ่ม จะเป็นอย่างไร?”",shuffle:"สับไพ่",again:"ถามใหม่",
  quota:n=>`เหลือ ${n}/3 คำถามวันนี้`,share:"แชร์ดวง",shH:"แชร์คำทำนาย",showQ:"แสดงคำถามของฉัน",ig:"IG Story",save:"บันทึกรูป",copy:"คัดลอกลิงก์",copied:"คัดลอกลิงก์แล้ว",close:"ปิด",appOnly:"ในแอปจริงจะบันทึกรูปขนาด 1080×1920 ลงเครื่อง",cta:"ดูดวงไพ่ทาโรต์ฟรี",private:"คำถามถูกซ่อนไว้",shareMsg:"ดูไพ่ทาโรต์ของฉันวันนี้ ลองดูดวงฟรีที่ TarotNice",ask:"อยากถามอะไรวันนี้?",ph:"เช่น งานใหม่ที่กำลังจะเริ่ม จะเป็นอย่างไร?",tl:"เรื่อง",topics:["ความรัก","การงาน","การเงิน","สุขภาพ","ทั่วไป"],need:"พิมพ์คำถามก่อนนะ แล้วค่อยสับไพ่",h0:"สวัสดี เราชื่อเงิน พิมพ์คำถาม เลือกเรื่อง แล้วแตะ “สับไพ่”",h1:"กำลังสับไพ่…",
  h2:n=>`เลือกไพ่อีก ${n} ใบ`,h3:"กำลังเปิดไพ่…",h4:"นี่คือคำทำนายของคุณ",sleep:"เงินขอพักก่อนนะ คำถามใหม่พรุ่งนี้",
  up:"ไพ่ตั้ง",rv:"ไพ่กลับหัว",
  note:"ต้นแบบแอนิเมชัน: ข้อความคำทำนายด้านบนเป็นตัวอย่าง ในแอปจริงจะสตรีมจาก Workers AI"},
 en:{day:"Day",night:"Night",tag:"tarot",q:"“How will the new job I'm starting go?”",shuffle:"Shuffle",again:"Ask again",
  quota:n=>`${n} of 3 questions left today`,share:"Share",shH:"Share your reading",showQ:"Show my question",ig:"IG Story",save:"Save image",copy:"Copy link",copied:"Link copied",close:"Close",appOnly:"In the app this saves a 1080×1920 image to your phone",cta:"Free tarot reading",private:"Question kept private",shareMsg:"Here are my tarot cards today. Get a free reading at TarotNice",ask:"What would you like to ask today?",ph:"e.g. How will the new job I'm starting go?",tl:"About",topics:["Love","Career","Money","Health","General"],need:"Type your question first, then shuffle.",h0:"Hi, I'm Ngern. Type your question, pick a topic, then tap Shuffle.",h1:"Shuffling…",
  h2:n=>`Choose ${n} more card${n>1?"s":""}`,h3:"Turning the cards…",h4:"Here is your reading",sleep:"Ngern is resting now. New questions tomorrow.",
  up:"Upright",rv:"Reversed",
  note:"Animation prototype: the reading text above is sample copy. In the app it streams from Workers AI."}
};
const MAJOR=[["The Fool","คนโง่"],["The Magician","นักมายากล"],["The High Priestess","นักบวชหญิง"],["The Empress","จักรพรรดินี"],["The Emperor","จักรพรรดิ"],["The Hierophant","พระสันตะปาปา"],["The Lovers","คู่รัก"],["The Chariot","รถศึก"],["Strength","พลัง"],["The Hermit","ฤๅษี"],["Wheel of Fortune","กงล้อแห่งโชคชะตา"],["Justice","ความยุติธรรม"],["The Hanged Man","คนแขวน"],["Death","ความตาย"],["Temperance","ความพอดี"],["The Devil","ปีศาจ"],["The Tower","หอคอย"],["The Star","ดวงดาว"],["The Moon","ดวงจันทร์"],["The Sun","ดวงอาทิตย์"],["Judgement","การพิพากษา"],["The World","โลก"]];
const SUITS=[["Wands","ไม้เท้า","w"],["Cups","ถ้วย","c"],["Swords","ดาบ","s"],["Pentacles","เหรียญ","p"]];
const RANKS=[["Ace","เอซ","A"],["Two","2","2"],["Three","3","3"],["Four","4","4"],["Five","5","5"],["Six","6","6"],["Seven","7","7"],["Eight","8","8"],["Nine","9","9"],["Ten","10","10"],["Page","เพจ","P"],["Knight","อัศวิน","Kn"],["Queen","ราชินี","Q"],["King","ราชา","K"]];
const ROMAN=["0","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI","XVII","XVIII","XIX","XX","XXI"];
const DECK=[...MAJOR.map(([en,th],i)=>({en,th,label:ROMAN[i],g:"m"+(i%4)})),
 ...SUITS.flatMap(([se,st,g])=>RANKS.map(([re,rt,lb])=>({en:`${re} of ${se}`,th:`${rt} ${st}`.replace(/^(\d+) /,`$1 `),label:lb,g})))];
DECK.forEach(d=>{const m=d.th.match(/^(\d+) (.+)$/);if(m)d.th=`${m[2]} ${m[1]}`;else if(d.g.length===1){const [r,...su]=d.th.split(" ");d.th=`${r}${su.join(" ")}`;}});
const SAMPLE={
 th:["ไพ่ใบนี้ชี้ว่าคุณมีพื้นฐานที่ดีอยู่แล้ว ประสบการณ์เดิมคือทุนสำคัญ","ช่วงนี้มีการเปลี่ยนแปลง เปิดใจรับสิ่งใหม่และอย่ารีบตัดสิน","มีโอกาสเติบโต หากคุณกล้าแสดงความสามารถตั้งแต่ต้น"],
 en:["This card says you already have solid ground; your experience is an asset.","Change is in the air. Stay open and don't judge too early.","There's room to grow if you show what you can do early on."]};
const SUITG={
 w:'<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4v32M14 10l6-6 6 6M15 20h10" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
 c:'<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9 8h22c0 10-5 16-11 16S9 18 9 8zM20 24v8M13 34h14" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
 s:'<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3l3 5v20h-6V8zM12 28h16M20 28v9" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
 p:'<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M20 8l3.5 10.5h11l-9 6.5 3.5 10.5-9-6.5-9 6.5 3.5-10.5-9-6.5h11z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>'};
const glyph=g=>{if(SUITG[g])return SUITG[g];const k=+g[1];
 if(k===0)return'<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="8" fill="none" stroke="currentColor" stroke-width="1.5"/><g stroke="currentColor" stroke-width="1.5">'+Array.from({length:8},(_,j)=>{const a=j*Math.PI/4;return`<line x1="${20+12*Math.cos(a)}" y1="${20+12*Math.sin(a)}" x2="${20+17*Math.cos(a)}" y2="${20+17*Math.sin(a)}"/>`}).join("")+'</g></svg>';
 if(k===1)return'<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M26 6a14 14 0 1 0 0 28a11 11 0 1 1 0-28z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';
 if(k===2)return'<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4l4 12h12l-10 7 4 13-10-8-10 8 4-13-10-7h12z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';
 return'<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4L36 20L20 36L4 20Z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="20" cy="20" r="5" fill="currentColor"/></svg>';};

let topic=1,lang="th",left=3,state="idle",picked=[],cards=[],G={};
const $=id=>document.getElementById(id), stage=$("stage");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait=ms=>new Promise(r=>setTimeout(r,reduce?Math.min(ms,30):ms));
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n};

function geom(){const W=stage.clientWidth;const cw=Math.min(104,Math.max(60,W/5.4)),ch=cw*1.65;
 const slotY=10,deckY=slotY+ch+18+ch*.62,droop=ch*.18,H=Math.round(deckY+ch+droop+16);
 stage.style.height=H+"px";
 G={W,H,cw,ch,cx:W/2-cw/2,deckY,slotY,droop,slotX:[W/2-cw*1.75,W/2,W/2+cw*1.75]};}
function place(c,x,y,r=0,s=1,z){c.el.style.transform=`translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`;if(z!=null)c.el.style.zIndex=z;}
function deckPos(c,i){place(c,G.cx-i*.12,G.deckY-i*.12,0,1,i);}

function build(){
 stage.innerHTML="";geom();
 G.slotX.forEach((x,i)=>{const f=document.createElement("div");f.className="slotframe";Object.assign(f.style,{left:x-G.cw/2+"px",top:G.slotY+"px",width:G.cw+"px",height:G.ch+"px"});stage.append(f);
});
 const order=DECK.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=rnd(i+1);[order[i],order[j]]=[order[j],order[i]];}
 cards=order.map((id,i)=>{const el=document.createElement("button");el.className="card";el.type="button";el.tabIndex=-1;
  el.style.width=G.cw+"px";el.style.height=G.ch+"px";el.style.fontSize=(G.cw/7.4)+"px";
  el.innerHTML=`<div class="inner"><div class="face back"></div><div class="face front"><div class="fx"><div class="num">${DECK[id].label}</div>${glyph(DECK[id].g)}<div class="nm"></div></div></div></div>`;
  const c={el,id,rev:rnd(4)===0};if(c.rev)el.classList.add("rev");
  el.addEventListener("click",()=>pick(c));stage.append(el);deckPos(c,i);return c;});
 text();
}
function text(){const t=T[lang];$("mdayT").textContent=t.day;$("mnightT").textContent=t.night;$("tag").textContent=t.tag;$("go").textContent=t.shuffle;$("shareT").textContent=t.share;$("shareBtn").hidden=!(state==="done"||state==="sleep");$("shH").textContent=t.shH;$("showQT").textContent=t.showQ;$("tIgT").textContent=t.ig;$("tSaveT").textContent=t.save;$("tCopyT").textContent=t.copy;$("shClose").textContent=t.close;if(!$("sheet").hidden)renderStory();$("go").disabled=left<=0;$("qlabel").textContent=t.ask;$("qin").placeholder=t.ph;$("tlabel").textContent=t.tl;
 document.querySelectorAll("#topics .chip").forEach((b,i)=>b.textContent=t.topics[i]);$("askedTopic").textContent=t.topics[topic];$("shuffle").textContent=t.shuffle;$("again").textContent=t.again;$("note").textContent=t.note;
 $("quotaTxt").textContent=t.quota(left);$("pips").innerHTML=[0,1,2].map(i=>`<span class="pip${i>=left?" used":""}"></span>`).join("");
 cards.forEach(c=>c.el.querySelector(".nm").textContent=DECK[c.id][lang]);
 $("guide").className="guide s-"+state;$("hint").textContent=state==="sleep"?t.sleep:state==="idle"?t.h0:state==="shuffling"?t.h1:state==="picking"?t.h2(3-picked.length):state==="reveal"?t.h3:t.h4;
 if(state==="done"||state==="sleep")renderReading();}

async function shuffle(){
 if(state!=="idle"||left<=0)return;
 const qv=$("qin").value.trim();
 if(!qv){$("qin").classList.add("need");$("qin").focus();$("hint").textContent=T[lang].need;return;}
 $("question").textContent=`“${qv}”`;$("ask").hidden=true;$("asked").hidden=false;
 state="shuffling";$("shuffle").disabled=true;text();
 const n=cards.length,half=Math.floor(n/2),off=Math.min(G.cw*1.1,G.W*.22);
 for(let round=0;round<3;round++){
  // split into two halves
  cards.forEach((c,i)=>{c.el.style.transitionDelay="0ms";const L=i<half,k=L?i:i-half;
   place(c,G.cx+(L?-off:off)-k*.12,G.deckY-10-k*.12,L?-9:9,1,i);});
  await wait(420);
  // riffle: interleave halves back, bottom-up, alternating sides
  const merged=[];for(let k=0;k<half+1;k++){if(cards[k]&&k<half)merged.push(cards[k]);if(cards[half+k])merged.push(cards[half+k]);}
  merged.forEach((c,i)=>{c.el.style.transitionDelay=(i*7)+"ms";deckPos(c,i);});
  cards=merged;await wait(420+n*7);
 }
 // overhand cut
 cards.forEach(c=>c.el.style.transitionDelay="0ms");
 const top=cards.slice(half);top.forEach((c,k)=>place(c,G.cx-k*.12,G.deckY-G.ch*.55-k*.12,4,1,100+k));await wait(380);
 cards=[...top,...cards.slice(0,half)];cards.forEach((c,i)=>deckPos(c,i));await wait(450);
 // fan out
 // two arcs: back row (first half) sits higher, front row overlaps its lower part
 const rows=[cards.slice(0,Math.ceil(n/2)),cards.slice(Math.ceil(n/2))],span=110,maxX=(G.W-G.cw*1.75)/2,smax=Math.sin(span/2*Math.PI/180);
 rows.forEach((row,r)=>row.forEach((c,j)=>{const m=row.length,a=-span/2+span*j/(m-1),rad=a*Math.PI/180;
  const y=G.deckY-(r===0?G.ch*.62:0)+G.droop*(1-Math.cos(rad))/(1-Math.cos(span/2*Math.PI/180));
  c.fan=[G.cx+maxX*Math.sin(rad)/smax,y,a*.5];c.z=r*100+j;}));
 cards.forEach((c,i)=>{
  c.el.style.transitionDelay=(i*7)+"ms";place(c,...c.fan,1,c.z);c.el.classList.add("pickable");c.el.tabIndex=0;});
 await wait(600+n*7);cards.forEach(c=>c.el.style.transitionDelay="0ms");
 state="picking";text();
}
async function pick(c){
 if(state!=="picking"||picked.includes(c))return;
 const slot=picked.length;picked.push(c);c.el.classList.remove("pickable");c.el.tabIndex=-1;
 place(c,G.slotX[slot]-G.cw/2,G.slotY,0,1,200+slot);text();
 if(picked.length<3)return;
 state="reveal";text();
 cards.filter(x=>!picked.includes(x)).forEach((x,i)=>{x.el.classList.remove("pickable");x.el.tabIndex=-1;x.el.style.transitionDelay=(i*4)+"ms";deckPos(x,i);});
 await wait(700);
 for(const p of picked){p.el.classList.add("flipped");await wait(650);}
 left--;state="done";text();$("again").hidden=left<=0;
 if(left<=0)setTimeout(()=>{if(state==="done"){state="sleep";text();}},3000);
}
const SHARE_URL="https://tarotnice.com/r/demo";
function renderStory(){const t=T[lang],q=$("qin").value.trim()||$("question").textContent.replace(/[“”]/g,"");
 const minis=picked.map(p=>`<div class="mini${p.rev?" rev":""}"><div class="fx"><div class="num">${DECK[p.id].label}</div>${glyph(DECK[p.id].g)}<div class="nm">${DECK[p.id][lang]}</div></div></div>`).join("");
 const ng=document.querySelector(".mark").outerHTML;
 $("story").innerHTML=`<div class="brand">${ng}TarotNice</div>
  <p class="sq">${$("showQ").checked?"“"+q.replace(/</g,"&lt;")+"”":"✦ "+t.private+" ✦"}</p>
  <div class="minis">${minis}</div>
  <p class="sum">${SAMPLE[lang][1]}</p>
  <div class="cta">${t.cta}<b>tarotnice.com</b></div>`;
 const msg=encodeURIComponent(t.shareMsg+" "+SHARE_URL);
 $("tLine").href="https://social-plugins.line.me/lineit/share?url="+encodeURIComponent(SHARE_URL)+"&text="+msg;
 $("tFb").href="https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(SHARE_URL);
 $("tX").href="https://twitter.com/intent/tweet?text="+msg;}
function openShare(){$("sheet").hidden=false;$("toast").textContent="";renderStory();$("shClose").focus();}
function renderReading(){const t=T[lang];
 $("reading").innerHTML=picked.map((p,i)=>`<div class="rc"><b>${DECK[p.id][lang]}</b> <span>· ${p.rev?t.rv:t.up}</span><p>${SAMPLE[lang][i]}</p></div>`).join("");
 [...$("reading").children].forEach((el,i)=>setTimeout(()=>el.classList.add("on"),reduce?0:i*250));}
function reset(){$("qin").value="";$("ask").hidden=false;$("asked").hidden=true;picked=[];state="idle";$("reading").innerHTML="";$("again").hidden=true;$("shuffle").disabled=left<=0;build();}

$("shuffle").onclick=shuffle;
$("shareBtn").onclick=openShare;$("shClose").onclick=()=>{$("sheet").hidden=true;$("shareBtn").focus();};
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")$("sheet").hidden=true;});
addEventListener("keydown",e=>{if(e.key==="Escape")$("sheet").hidden=true;});
$("showQ").onchange=renderStory;
$("tCopy").onclick=()=>{const done=()=>$("toast").textContent=T[lang].copied;try{navigator.clipboard.writeText(SHARE_URL).then(done,done)}catch(e){done()}};
$("tSave").onclick=$("tIg").onclick=()=>{$("toast").textContent=T[lang].appOnly;};
T.th.topics.forEach((_,i)=>{const b=document.createElement("button");b.type="button";b.className="chip";b.setAttribute("aria-pressed",i===topic);
 b.onclick=()=>{topic=i;document.querySelectorAll("#topics .chip").forEach((x,j)=>x.setAttribute("aria-pressed",j===i));};$("topics").append(b);});
$("qin").addEventListener("input",()=>$("qin").classList.remove("need"));
$("qin").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();shuffle();}});
$("ask").addEventListener("submit",e=>{e.preventDefault();shuffle();});$("again").onclick=reset;
$("lth").onclick=()=>{lang="th";$("lth").setAttribute("aria-pressed","true");$("len").setAttribute("aria-pressed","false");text();};
$("len").onclick=()=>{lang="en";$("len").setAttribute("aria-pressed","true");$("lth").setAttribute("aria-pressed","false");text();};
function setMode(m){document.documentElement.dataset.mode=m;$("mday").setAttribute("aria-pressed",m==="day");$("mnight").setAttribute("aria-pressed",m==="night");try{localStorage.setItem("tarotnice:mode",m)}catch(e){}}
$("mday").onclick=()=>setMode("day");$("mnight").onclick=()=>setMode("night");
{let m=null;try{m=localStorage.getItem("tarotnice:mode")}catch(e){}
 if(!m){const h=new Date().getHours();m=(h>=18||h<6)?"night":"day";}setMode(m);}
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if(state==="idle")build();},200);});
build();
</script>
